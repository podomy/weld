# Mosquitto sidecar for the weld MQTT live gate.
#
# Plain MQTT on 1883, TLS on 8883, authenticated MQTT on 1884.
# Test traffic only; never expose beyond localhost.

persistence false
log_dest stderr
log_type error
log_type warning

listener 1883
protocol mqtt
listener_allow_anonymous true

listener 8883
protocol mqtt
listener_allow_anonymous true
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server-key.pem
require_certificate false

listener 1884
protocol mqtt
listener_allow_anonymous false
password_file /mosquitto/passwd/passwd
