name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # The workspace covers root plus sdk; cmd/weld is its own module
      # and builds with GOWORK=off (see the comment in cmd/weld/go.mod).
      - run: go mod tidy
      - run: go mod tidy
        working-directory: sdk
      - run: go mod tidy
        working-directory: cmd/weld
        env:
          GOWORK: "off"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - run: golangci-lint run ./...
        working-directory: sdk

      - run: golangci-lint run ./...
        working-directory: cmd/weld
        env:
          GOWORK: "off"

      - run: go vet ./...
      - run: go vet ./...
        working-directory: sdk
      - run: go vet ./...
        working-directory: cmd/weld
        env:
          GOWORK: "off"

      - run: go test -coverprofile=coverage.out -covermode=atomic ./...

      - run: go test ./...
        working-directory: sdk

      - run: go test ./...
        working-directory: cmd/weld
        env:
          GOWORK: "off"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  build:
    name: Build Binaries
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: weld-linux-amd64
          - os: linux
            arch: arm64
            output: weld-linux-arm64
          - os: linux
            arch: arm
            arm_version: "7"
            output: weld-linux-armv7
          - os: linux
            arch: riscv64
            output: weld-linux-riscv64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Pure Go: no C toolchain needed. The DDS backend speaks RTPS
      # directly over UDP with no cgo and no libcontainer linkage.
      - name: Build binary
        working-directory: cmd/weld
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_version }}
          GOWORK: "off"
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          go build -trimpath -ldflags="-s -w" -o "${{ github.workspace }}/dist/${{ matrix.output }}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30
