name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # Fast gate: tidy plus format diff plus header check plus lint
      # plus vet plus test for the root module, excluding
      # testbed/live which needs the fleet. This is the same
      # `go run ./check/` the pre-commit hook runs.
      - run: go run ./check/
