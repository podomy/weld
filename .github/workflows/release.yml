name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: weld-linux-amd64
          - os: linux
            arch: arm64
            output: weld-linux-arm64
          - os: linux
            arch: arm
            arm_version: "7"
            output: weld-linux-armv7
          - os: linux
            arch: riscv64
            output: weld-linux-riscv64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Pure Go: no C toolchain needed. The DDS backend speaks RTPS
      # directly over UDP with no cgo and no libcontainer linkage.
      - name: Build binary
        working-directory: cmd/weld
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_version }}
          GOWORK: "off"
        run: |
          mkdir -p "${{ github.workspace }}/dist"
          go build -trimpath -ldflags="-s -w" -o "${{ github.workspace }}/dist/${{ matrix.output }}" .

      - name: Zip binary
        run: |
          cd dist
          zip "${{ matrix.output }}-${{ github.ref_name }}.zip" "${{ matrix.output }}"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}-${{ github.ref_name }}
          path: dist/${{ matrix.output }}-${{ github.ref_name }}.zip
          retention-days: 30

  release:
    name: Publish Bare Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # gh release create shells out to git for repo context, so it
      # needs a checkout even though the zips come from artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Bare by policy: version and zips only, no description notes.
      # The changelog lives on GitHub releases; there is no CHANGELOG
      # file in the repo.
      - name: Create release and attach zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --notes ""
