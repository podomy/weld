services:
  ros-humble:
    build:
      context: ..
      dockerfile: testbed/ros2/humble/Dockerfile
    container_name: ros-humble
    network_mode: host
    command: ["sleep", "infinity"]
    volumes:
      - ./logs:/testbed/logs

  ros-jazzy:
    build:
      context: ..
      dockerfile: testbed/ros2/jazzy/Dockerfile
    container_name: ros-jazzy
    network_mode: host
    command: ["sleep", "infinity"]
    volumes:
      - ./logs:/testbed/logs

  ros-rolling:
    build:
      context: ..
      dockerfile: testbed/ros2/rolling/Dockerfile
    container_name: ros-rolling
    network_mode: host
    command: ["sleep", "infinity"]
    volumes:
      - ./logs:/testbed/logs

  weld:
    build:
      context: ..
      dockerfile: Dockerfile
    image: testbed-weld:latest
    container_name: weld
    network_mode: host
    command: ["sleep", "infinity"]
    volumes:
      - ./logs:/testbed/logs
