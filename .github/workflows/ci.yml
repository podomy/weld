name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      # Fast gate: tidy plus format diff plus header check plus lint
      # plus vet plus test across root, sdk, and cmd/weld, excluding
      # testbed/live which needs the fleet. This is the same
      # `go run ./check/` the pre-commit hook runs.
      - run: go run ./check/

  build:
    name: Build Binaries
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            output: weld-linux-amd64
          - os: linux
            arch: arm64
            output: weld-linux-arm64
          - os: linux
            arch: arm
            arm_version: "7"
            output: weld-linux-armv7
          - os: linux
            arch: riscv64
            output: weld-linux-riscv64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      # Pure Go (no `import "C"` in the repo), so CGO stays off and no
      # C toolchain is needed for any target. cmd/weld is its own
      # module outside the workspace, so it builds with GOWORK=off.
      - name: Build binary
        working-directory: cmd/weld
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          GOARM: ${{ matrix.arm_version }}
          CGO_ENABLED: "0"
          GOWORK: "off"
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/dist/${{ matrix.output }}" .

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          retention-days: 30
